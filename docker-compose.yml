version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mailtoall-postgres
    environment:
      POSTGRES_DB: mailtoall
      POSTGRES_USER: mailtoall
      POSTGRES_PASSWORD: mailtoall_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailtoall -d mailtoall"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mailtoall-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mailtoall-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mailtoall
      SPRING_DATASOURCE_USERNAME: mailtoall
      SPRING_DATASOURCE_PASSWORD: mailtoall_secret
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-your-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-your-google-client-secret}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:-mailtoall-super-secure-32-byte-key!}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
